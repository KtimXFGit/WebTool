name: Fix Imported Pixel Resource

on:
  push:
    branches: [main]
    paths:
      - 'tools/fix-imported-ui-resource.py'
      - '.github/workflows/fix-imported-ui-resource.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix imported glyph record
        run: python tools/fix-imported-ui-resource.py
      - name: Commit resource fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui-resource/grs-ui-faces.js
          git commit -m '修正HAXRCORP数字7字形资源导入'
          git push origin HEAD:main
