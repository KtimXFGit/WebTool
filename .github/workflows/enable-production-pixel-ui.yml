name: Enable Production Pixel UI

on:
  push:
    branches: [main]
    paths:
      - 'tools/enable-production-pixel-ui.py'
      - '.github/workflows/enable-production-pixel-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch LCD render entry
        run: python tools/enable-production-pixel-ui.py
      - name: Syntax checks
        run: |
          node --check grs-production-ui.js
          node --check app.js
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html
          if git diff --cached --quiet; then
            echo 'No integration changes.'
            exit 0
          fi
          git commit -m '切换到Production逐像素LCD渲染'
          git push origin HEAD:main
