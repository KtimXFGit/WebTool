name: Apply UI Preview Script

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-ui-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert UI preview script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '  <script src="grs-production-ui.js"></script>\n  <script src="app.js"></script>'
          new = '  <script src="grs-production-ui.js"></script>\n  <script src="ui-preview.js"></script>\n  <script src="app.js"></script>'
          if 'src="ui-preview.js"' not in s:
              if old not in s:
                  raise SystemExit('index.html insertion anchor not found')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "启用精简主界面对比预览"
          git push
