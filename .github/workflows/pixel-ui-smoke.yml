name: Pixel UI Smoke Test

on:
  push:
    branches: [main]
    paths:
      - 'grs-production-ui.js'
      - 'ui-resource/**'
      - 'tests/pixel-ui-smoke.js'
      - '.github/workflows/pixel-ui-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check grs-production-ui.js
          node --check app.js
      - name: Render Production frames without browser fonts
        run: node tests/pixel-ui-smoke.js
